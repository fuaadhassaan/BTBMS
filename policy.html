<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTicket - Cancellation Policy</title>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2f55d4" />
  <link rel="modulepreload" href="passenger.js" />
  <link rel="stylesheet" href="passenger.css" />
  <!-- Before the first paint, so the page never flashes the wrong theme. -->
  <script>
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('btbms-theme') === 'light' ? 'light' : 'dark');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body data-page="policy">
  <div class="backdrop" aria-hidden="true"></div>

  <nav class="topbar" aria-label="Site">
    <a class="brand" href="index.html" aria-label="DTicket home">
      <img src="logo.svg" width="38" height="38" alt="" />
      <span class="brand-text"><strong>DTicket</strong><small>The all-in-one Ticketing Website</small></span>
    </a>
    <div class="top-actions">
      <a class="home-logo" href="index.html" aria-label="Home" title="Home"><img src="logo.svg" width="36" height="36" alt="" /></a>
      <a class="btn btn-ghost btn-sm" href="ticket-booking.html" aria-label="Book a ticket"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4z"/></svg><span>Book</span></a>
      <button type="button" class="icon-btn" data-refresh title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
      <div class="clock" id="clock" title="Bangladesh Standard Time (UTC+6)">--:--:--</div>
      <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch between dark and light">
        <span class="theme-moon" aria-hidden="true">&#9790;</span>
        <span class="theme-sun" aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </nav>

  <main class="page policy-page">
    <header class="rise">
      <p class="eyebrow">Before you book</p>
      <h1 class="page-title">Cancellation policy</h1>
      <p class="page-sub">How much you get back depends on how long before departure you cancel.</p>
    </header>

    <section class="glass policy-card rise" style="--d: 0.08s" aria-labelledby="tiersTitle">
      <h2 id="tiersTitle">Refunds</h2>
      <div class="policy-tiers" id="policyTiers"></div>
      <p class="field-hint" id="policyExample"></p>
    </section>

    <section class="glass policy-card rise" style="--d: 0.16s" aria-labelledby="rulesTitle">
      <h2 id="rulesTitle">How it works</h2>
      <ul class="policy-points" id="policyPoints"></ul>
    </section>

    <div class="policy-actions rise" style="--d: 0.24s">
      <a class="btn" href="ticket-booking.html">Book a ticket</a>
      <a class="btn btn-ghost" href="index.html">Back to home</a>
    </div>
  </main>

  <script type="module" src="passenger.js"></script>
</body>
</html>
